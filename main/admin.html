<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị dữ liệu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark app-nav"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="/"><img class="brand-logo" src="../assets/images/tvu-logo.webp" alt="Logo Trường Đại học Trà Vinh"><span>Đánh giá giảng dạy</span></a><div class="d-flex gap-2"><a href="/main/reports.html" class="btn btn-outline-light btn-sm">Báo cáo</a><a href="/" class="btn btn-light btn-sm">Bảng điều khiển</a></div></div></nav>
  <main class="container py-4 py-lg-5">
    <div class="page-heading mb-4"><img class="page-logo" src="../assets/images/tvu-logo.webp" alt="Logo Trường Đại học Trà Vinh"><div><p class="eyebrow mb-1">QUẢN TRỊ HỆ THỐNG</p><h1 class="h2 mb-0">Danh mục và khảo sát</h1></div></div>
    <div id="alert-area" aria-live="polite"></div>
    <article class="panel">
      <div class="row align-items-end g-3 mb-4">
        <div class="col-md-5"><label for="resource-select" class="form-label">Chọn nội dung quản lý</label>
          <select id="resource-select" class="form-select">
            <option value="lecturers">Giảng viên</option><option value="courses">Học phần</option><option value="classes">Lớp học</option>
            <option value="questions">Câu hỏi khảo sát</option><option value="users">Tài khoản người dùng</option>
            <option value="assignments">Phân công giảng dạy</option><option value="surveys">Khảo sát</option><option value="enrollments">Ghi danh sinh viên</option>
            <option value="policy">Chính sách đánh giá</option>
          </select>
        </div>
        <div class="col-md-auto"><button id="refresh-admin" class="btn btn-outline-primary" type="button">Tải lại</button></div>
      </div>
      <div class="row g-4">
        <div class="col-lg-4"><div class="admin-form-wrap"><h2 class="h5" id="form-title">Thêm dữ liệu</h2>
          <form id="admin-form" class="d-grid gap-3"></form>
        </div></div>
        <div class="col-lg-8"><div class="d-flex justify-content-between align-items-center gap-2 mb-2"><h2 class="h5 mb-0">Dữ liệu hiện có</h2><span class="text-secondary small" id="list-status"></span></div>
          <div class="table-responsive"><table class="table align-middle"><thead id="admin-head"></thead><tbody id="admin-body"></tbody></table></div>
        </div>
      </div>
    </article>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
