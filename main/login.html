<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Đánh giá chất lượng giảng dạy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="login-card panel w-100">
        <a class="login-brand text-decoration-none" href="/" aria-label="Đánh giá giảng dạy">
            <img class="login-logo"src="../assets/images/tvu-logo.webp"alt="Logo Trường Đại học Trà Vinh">
            <span class="login-brand-text">ĐÁNH GIÁ CHẤT LƯỢNG GIẢNG DẠY</span>
        </a>
      <p class="login-eyebrow">CỔNG THÔNG TIN</p>
      <h1 class="login-title">Đăng nhập hệ thống</h1>
      <p class="text-secondary">Sử dụng tài khoản do quản trị viên cấp.</p>
      <div id="alert-area" aria-live="polite"></div>
      <form id="login-form" novalidate>
        <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" class="form-control" type="email" autocomplete="username" required maxlength="255"></div>
        <div class="mb-4"><label for="password" class="form-label">Mật khẩu</label><input id="password" name="password" class="form-control" type="password" autocomplete="current-password" required maxlength="200"></div>
        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
      </form>
      <p class="mt-3 mb-0 text-center"><a href="/main/recovery.html">Quên mật khẩu?</a></p>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
