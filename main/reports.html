<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo cáo đánh giá</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark app-nav"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="/"><img class="brand-logo" src="../assets/images/tvu-logo.webp" alt="Logo Trường Đại học Trà Vinh"><span>Đánh giá giảng dạy</span></a><div class="d-flex gap-2"><button class="btn btn-outline-light btn-sm" id="print-report">In / Xuất PDF</button><a href="/" class="btn btn-light btn-sm">Bảng điều khiển</a></div></div></nav>
  <main class="container py-4 py-lg-5">
    <header class="report-heading mb-4"><img class="report-logo" src="../assets/images/tvu-logo.webp" alt="Logo Trường Đại học Trà Vinh"><div><p class="eyebrow mb-1">TRƯỜNG ĐẠI HỌC TRÀ VINH · PHÂN TÍCH KẾT QUẢ</p><h1 class="h2 mb-0">Báo cáo đánh giá</h1></div></header>
    <div id="alert-area" aria-live="polite"></div>
    <article class="panel mb-4"><form id="report-filter" class="row g-3 align-items-end">
      <div class="col-sm-6 col-lg-3 d-none" id="lecturer-filter-wrap"><label class="form-label" for="lecturer-filter">Giảng viên</label><select id="lecturer-filter" class="form-select"><option value="">Tất cả giảng viên</option></select></div>
      <div class="col-sm-6 col-lg-3"><label class="form-label" for="course-filter">Học phần</label><select id="course-filter" class="form-select"><option value="">Tất cả học phần</option></select></div>
      <div class="col-sm-6 col-lg-2"><label class="form-label" for="from-filter">Từ ngày</label><input id="from-filter" type="date" class="form-control"></div>
      <div class="col-sm-6 col-lg-2"><label class="form-label" for="to-filter">Đến ngày</label><input id="to-filter" type="date" class="form-control"></div>
      <div class="col-sm-6 col-lg-2"><label class="form-label" for="year-filter">Năm học</label><input id="year-filter" class="form-control" maxlength="20" placeholder="2026-2027"></div>
      <div class="col-sm-6 col-lg-2"><label class="form-label" for="semester-filter">Học kỳ</label><input id="semester-filter" class="form-control" maxlength="30" placeholder="Học kỳ 1"></div>
      <div class="col-lg-2"><button class="btn btn-primary w-100" type="submit">Lọc báo cáo</button></div>
      <div class="col-lg-2"><button class="btn btn-outline-primary w-100" id="export-csv" type="button">Tải CSV</button></div>
    </form></article>
    <div id="report-summary" class="text-secondary mb-3"></div>
    <div id="report-list" class="d-grid gap-4"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/reports.js"></script>
</body>
</html>
