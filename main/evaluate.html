<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đánh giá học phần</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark app-nav"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="/"><img class="brand-logo" src="../assets/images/tvu-logo.webp" alt="Logo Trường Đại học Trà Vinh"><span>Đánh giá giảng dạy</span></a><a class="btn btn-sm btn-outline-light" href="/">Quay lại</a></div></nav>
  <main class="container py-4 py-lg-5">
    <div class="row justify-content-center"><div class="col-lg-9">
      <div id="alert-area" aria-live="polite"></div>
      <article class="panel">
        <p class="eyebrow mb-1">PHIẾU ĐÁNH GIÁ ẨN DANH</p>
        <h1 class="h3" id="survey-title">Đang tải khảo sát…</h1>
        <p class="text-secondary" id="survey-description"></p>
        <div class="likert-guide mb-4"><span>1 — Hoàn toàn không đồng ý</span><span>2</span><span>3 — Bình thường</span><span>4</span><span>5 — Hoàn toàn đồng ý</span></div>
        <form id="evaluation-form">
          <div id="question-list" class="d-grid gap-3"></div>
          <div class="mt-3"><label for="evaluation-feedback" class="form-label">Ý kiến bổ sung (không bắt buộc)</label><textarea id="evaluation-feedback" name="feedback" class="form-control" rows="4" maxlength="2000" placeholder="Chia sẻ góp ý giúp cải thiện học phần. Không ghi thông tin cá nhân."></textarea></div>
          <div class="mt-4 d-flex flex-wrap gap-2"><button id="submit-evaluation" class="btn btn-primary" type="submit">Gửi đánh giá</button><a class="btn btn-outline-secondary" href="/">Hủy</a></div>
        </form>
      </article>
    </div></div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/evaluation.js"></script>
</body>
</html>
