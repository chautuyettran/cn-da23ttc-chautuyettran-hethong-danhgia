services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_quality}
      MYSQL_USER: ${MYSQL_APP_USERNAME:?Set MYSQL_APP_USERNAME in .env.mysql}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app_network

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
        - "127.0.0.1:27018:27017"
    command:
      - sh
      - -c
      - umask 077 && printf '%s' "$$MONGO_REPLICA_KEY" > /tmp/mongodb-keyfile.new && chown mongodb:mongodb /tmp/mongodb-keyfile.new && chmod 400 /tmp/mongodb-keyfile.new && mv -f /tmp/mongodb-keyfile.new /tmp/mongodb-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: teaching_quality
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Set a random MONGO_REPLICA_KEY in .env}
    volumes:
      - mongo_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost
          --username "$$MONGO_APP_USERNAME"
          --password "$$MONGO_APP_PASSWORD"
          --authenticationDatabase teaching_quality
          --eval "const hello = db.adminCommand({hello:1}); if (hello.setName === 'rs0' && hello.isWritablePrimary) quit(0); quit(1);"
          || mongosh --quiet --host localhost
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { rs.status(); } catch (error) { if (error.code !== 94) throw error; rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); } quit(1);"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_quality}
      MYSQL_USER: ${MYSQL_APP_USERNAME:?Set MYSQL_APP_USERNAME in .env.mysql}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MIN_REPORT_RESPONSES: ${MIN_REPORT_RESPONSES:-5}
      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      AVATAR_STORAGE_DIR: /app/uploads/avatars
      TEST_LECTURER_PASSWORD: ${TEST_LECTURER_PASSWORD:-}
      TEST_LECTURER_NAME: ${TEST_LECTURER_NAME:-}
      TEST_LECTURER_DEPARTMENT: ${TEST_LECTURER_DEPARTMENT:-}
    volumes:
      - student_avatar_data:/app/uploads/avatars
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app_network

  admin-provision:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_quality}
      MYSQL_USER: ${MYSQL_APP_USERNAME:?Set MYSQL_APP_USERNAME in .env.mysql}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["npm", "run", "provision-admin"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  lecturer-provision:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_quality}
      MYSQL_USER: ${MYSQL_APP_USERNAME:?Set MYSQL_APP_USERNAME in .env.mysql}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
      LECTURER_NAME: ${LECTURER_NAME:-}
      LECTURER_EMAIL: ${LECTURER_EMAIL:-}
      LECTURER_PASSWORD: ${LECTURER_PASSWORD:-}
      LECTURER_DEPARTMENT: ${LECTURER_DEPARTMENT:-}
    command: ["npm", "run", "provision-lecturer"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  test-lecturer-provision:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_quality}
      MYSQL_USER: ${MYSQL_APP_USERNAME:?Set MYSQL_APP_USERNAME in .env.mysql}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
      TEST_LECTURER_PASSWORD: ${TEST_LECTURER_PASSWORD:-}
      TEST_LECTURER_NAME: ${TEST_LECTURER_NAME:-}
      TEST_LECTURER_DEPARTMENT: ${TEST_LECTURER_DEPARTMENT:-}
    command: ["npm", "run", "provision-test-lecturer"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  test-lecturer-password-reset:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teaching_quality}
      MYSQL_USER: ${MYSQL_APP_USERNAME:?Set MYSQL_APP_USERNAME in .env.mysql}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
      TEST_LECTURER_PASSWORD: ${TEST_LECTURER_PASSWORD:-}
      TEST_LECTURER_NAME: ${TEST_LECTURER_NAME:-}
      TEST_LECTURER_DEPARTMENT: ${TEST_LECTURER_DEPARTMENT:-}
    command: ["npm", "run", "reset-test-lecturer-password", "--", "--confirm"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mysql_data:
  mongo_data:
  student_avatar_data:

networks:
  app_network:
    driver: bridge
